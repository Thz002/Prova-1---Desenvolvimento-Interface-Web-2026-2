<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Perfil Estudante</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

            <tr>
                <td class="foto">
                    <img src="foto.jpg" alt="Foto do Estudante">

                    <p class="descriascao">Estudante de Ciência da Computação na PUC Minas, apaixonado por tecnologia e desenvolvimento web.</p>

                    <h3 class="subtitulo">Hobbies</h3>
                    <ul class="hobbies">
                        <li>Programação</li>
                        <li>Jogos eletrônicos</li>
                        <li>Leitura</li>
                    </ul>

                    <p class="link">Saiba mais em <a href="https://www.pucminas.br" target="_blank">PUC Minas</a>.</p>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2" class="rodape">&copy; 2026 Meu Perfil - Todos os direitos reservados.</td>
            </tr>
        </tfoot>
    </table>

</html>
